# Netlify UI: Package directory = sites/strahd, Base directory unset, so install
# and build run at the workspace root.
[build]
  command = "pnpm --filter strahd build"
  publish = "sites/strahd/dist"
  ignore = "bash scripts/netlify-ignore.sh strahd"

[build.environment]
  NODE_VERSION = "24"

# Cronologia was merged into Diario.
[[redirects]]
  from = "/cronologia"
  to = "/diario/"
  status = 301

# Umami, first-party (see sites/ogre-ballerino.mjs)
[[redirects]]
  from = "/stats/script.js"
  to = "https://stats.sirlisko.com/script.js"
  status = 200

[[redirects]]
  from = "/stats/api/send"
  to = "https://stats.sirlisko.com/api/send"
  status = 200
