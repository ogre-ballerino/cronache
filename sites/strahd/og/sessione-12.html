<html lang="it">
<head>

  <title>Sessione XII · Le carte di Madama Eva</title>

<body>
  <main class="card">
    <div class="cartouche">
      <p class="number">XII</p>
      <h1 class="title">Le carte di Madama Eva</h1>
      <p class="where">L'accampamento dei Vistani</p>
    </div>

    <!-- Madame Eva's cards laid in a cross on the table of her tent, the hanged man's noose at the centre -->
    <svg class="woodcut" viewBox="-660 -50 1200 630" data-arte="-340 130 1200 450" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="cut" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3" />
          <feDisplacementMap in="SourceGraphic" scale="2.5" />
        </filter>
        <filter id="ink" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="grain" />
          <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.937  0 0 0 0 0.902  0 0 0 0 0.816  9 0 0 0 -6.5" result="specks" />
          <feComposite in="specks" in2="SourceGraphic" operator="in" result="worn" />
          <feMerge><feMergeNode in="SourceGraphic" /><feMergeNode in="worn" /></feMerge>
        </filter>
      </defs>

      <g filter="url(#ink)">
        <g filter="url(#cut)">
          <rect x="-680" y="-70" width="1600" height="680" fill="#2a2016" />

          <!-- the folds of the tent -->
          <path d="M-680 -60 L260 -60 M260 -60 C200 60 80 200 -680 300 M260 -60 C320 60 440 200 920 300 M260 -60 C180 80 0 220 -400 300 M260 -60 C340 80 520 220 800 300 M260 -60 C240 100 160 240 60 300 M260 -60 C280 100 360 240 460 300" stroke="#efe6d0" stroke-width="1.6" fill="none" />

          <path d="M-680 312 H920 M-680 330 H920" stroke="#efe6d0" stroke-width="1.2" stroke-dasharray="4 8" />
          <!-- the cross of cards -->
          <path d="M116 358 h68 v104 h-68 Z" fill="#efe6d0" stroke="#2a2016" stroke-width="2" /><path d="M124 366 h52 v88 h-52 Z" fill="none" stroke="#2a2016" stroke-width="1.2" /><path d="M150 386 L166 410 L150 434 L134 410 Z" fill="#2a2016" /><circle cx="150" cy="410" r="5" fill="#efe6d0" /><path d="M336 358 h68 v104 h-68 Z" fill="#efe6d0" stroke="#2a2016" stroke-width="2" /><path d="M344 366 h52 v88 h-52 Z" fill="none" stroke="#2a2016" stroke-width="1.2" /><path d="M370 386 L386 410 L370 434 L354 410 Z" fill="#2a2016" /><circle cx="370" cy="410" r="5" fill="#efe6d0" /><path d="M226 248 h68 v104 h-68 Z" fill="#efe6d0" stroke="#2a2016" stroke-width="2" /><path d="M234 256 h52 v88 h-52 Z" fill="none" stroke="#2a2016" stroke-width="1.2" /><path d="M260 276 L276 300 L260 324 L244 300 Z" fill="#2a2016" /><circle cx="260" cy="300" r="5" fill="#efe6d0" /><path d="M226 468 h68 v104 h-68 Z" fill="#efe6d0" stroke="#2a2016" stroke-width="2" /><path d="M234 476 h52 v88 h-52 Z" fill="none" stroke="#2a2016" stroke-width="1.2" /><path d="M260 496 L276 520 L260 544 L244 520 Z" fill="#2a2016" /><circle cx="260" cy="520" r="5" fill="#efe6d0" /><path d="M226 358 h68 v104 h-68 Z" fill="#efe6d0" stroke="#2a2016" stroke-width="2" /><path d="M234 366 h52 v88 h-52 Z" fill="none" stroke="#2a2016" stroke-width="1.2" /><path d="M260 370 V404 M260 404 a10 13 0 1 0 0.1 0" stroke="#2a2016" stroke-width="3" fill="none" /><path d="M256 400 h8 M256 394 h8" stroke="#2a2016" stroke-width="2" />
