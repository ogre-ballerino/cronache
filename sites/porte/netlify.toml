# Netlify UI: Package directory = sites/porte, Base directory unset, so install
# and build run at the workspace root.
[build]
  command = "pnpm --filter porte build"
  publish = "sites/porte/dist"
  ignore = "bash scripts/netlify-ignore.sh porte"

[build.environment]
  NODE_VERSION = "24"

# Umami, first-party (see sites/ogre-ballerino.mjs)
[[redirects]]
  from = "/stats/script.js"
  to = "https://stats.sirlisko.com/script.js"
  status = 200

[[redirects]]
  from = "/stats/api/send"
  to = "https://stats.sirlisko.com/api/send"
  status = 200
