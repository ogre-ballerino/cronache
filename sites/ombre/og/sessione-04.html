<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Capitolo IV · Lo specchio d'opale</title>
  <link rel="stylesheet" href="og.css" />
</head>
<body>
  <main class="card">
    <div class="cartouche">
      <p class="number">Capitolo IV</p>
      <h1 class="title">Lo specchio d'opale</h1>
      <p class="where">Berlino e le Terre del Sogno</p>
    </div>

    <!-- Antiquitäten und Kuriositäten in its alley by the Spree: the sooty sign, the dimly lit window, the closed sign on the door -->
    <svg class="woodcut" viewBox="0 0 1200 630" data-arte="525 200 800 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <filter id="cut" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3" />
          <feDisplacementMap in="SourceGraphic" scale="2.5" />
        </filter>
        <filter id="ink" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="grain" />
          <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.055  0 0 0 0 0.09  0 0 0 0 0.082  9 0 0 0 -6.1" result="specks" />
          <feComposite in="specks" in2="SourceGraphic" operator="in" result="worn" />
          <feMerge><feMergeNode in="SourceGraphic" /><feMergeNode in="worn" /></feMerge>
        </filter>
      </defs>

      <g filter="url(#ink)">
        <g filter="url(#cut)">
          <rect x="-400" y="-40" width="2000" height="720" fill="#0e1715" />
          <!-- a strip of night sky between the roofs of the alley -->
          <g data-sky="-30 150" data-left="-300" data-width="2000" data-seed="4" stroke="#d8cfb6" fill="none" stroke-linecap="round"></g>
          <path fill="#0e1715" d="M-400 680 V60 H520 L560 30 L600 60 H660 V100 L700 80 V150 H1150 V70 L1180 50 L1210 70 H1600 V680 Z" />
          <!-- chimneys and the roofline cut against the sky -->
          <path d="M-400 60 H520 L560 30 L600 60 H660 V100 L700 80 V150 H1150 V70 L1180 50 L1210 70 H1600" stroke="#d8cfb6" stroke-width="2" fill="none" />
          <path fill="#0e1715" d="M760 150 V110 H786 V150 Z M1040 150 V116 H1062 V150 Z" />

          <!-- dark upper floors, their windows blind -->
          <g stroke="#d8cfb6" stroke-width="1.6" fill="none">
            <path d="M740 180 h60 v70 h-60 Z M860 180 h60 v70 h-60 Z M980 180 h60 v70 h-60 Z M1100 180 h60 v70 h-60 Z" />
            <path d="M770 180 v70 M890 180 v70 M1010 180 v70 M1130 180 v70" stroke-width="1" />
            <path d="M440 120 h50 v60 h-50 Z M440 230 h50 v60 h-50 Z" />
          </g>

          <!-- the shop sign, nearly illegible under the soot -->
          <path d="M712 276 H1130 V316 H712 Z" fill="#0e1715" stroke="#d8cfb6" stroke-width="2.4" />
          <text x="921" y="306" text-anchor="middle" font-family="UnifrakturMaguntia" font-size="25" fill="#d8cfb6" letter-spacing="0.5">Antiquitäten und Kuriositäten</text>

          <!-- the shop window, dim lamplight inside -->
          <clipPath id="shopwin"><rect x="724" y="330" width="236" height="156" /></clipPath>
          <clipPath id="doorglass"><rect x="1024" y="344" width="72" height="66" /></clipPath>
          <g clip-path="url(#shopwin)" data-sky="330 486" data-left="724" data-width="236" data-seed="44" stroke="#b0904e" fill="none" stroke-linecap="round"></g>
          <path fill="#0e1715" d="M700 330 H724 V486 H700 Z M960 330 H990 V486 H960 Z M700 486 H990 V500 H700 Z" />
          <path d="M724 330 H960 V486 H724 Z" stroke="#d8cfb6" stroke-width="2.4" fill="none" />
          <!-- the door, its glass dimly lit, the closed sign -->
          <path d="M1010 330 H1110 V500 H1010 Z" fill="#0e1715" stroke="#d8cfb6" stroke-width="2.4" />
          <g clip-path="url(#doorglass)" data-sky="344 410" data-left="1024" data-width="72" data-seed="45" stroke="#b0904e" fill="none" stroke-linecap="round"></g>
          <path d="M1024 344 H1096 V410 H1024 Z" stroke="#d8cfb6" stroke-width="1.6" fill="none" />
          <path d="M1036 344 L1060 330 L1084 344" stroke="#d8cfb6" stroke-width="1.2" fill="none" />
          <path d="M1027 368 H1093 V394 H1027 Z" fill="#d8cfb6" />
          <text x="1060" y="386" text-anchor="middle" font-family="UnifrakturMaguntia" font-size="12.5" fill="#0e1715">geschlossen</text>
          <circle cx="1096" cy="440" r="4" fill="#d8cfb6" />
          <path d="M1024 424 H1096 V486 H1024 Z" stroke="#d8cfb6" stroke-width="1.2" fill="none" />

          <!-- wet cobbles of the alley -->
          <path d="M-400 500 H1600 V680 H-400 Z" fill="#0e1715" />
          <path d="M-400 500 H1600" stroke="#d8cfb6" stroke-width="2.4" />
          <g stroke="#d8cfb6" stroke-width="1.4" fill="none" stroke-linecap="round">
            <path d="M572 514 q12 -6 23 0 M602 514 q14 -6 29 0 M637 514 q12 -6 25 0 M673 514 q10 -6 20 0 M703 514 q13 -6 26 0 M735 514 q12 -6 23 0 M768 514 q12 -6 24 0 M803 514 q11 -6 21 0 M832 514 q10 -6 21 0 M861 514 q15 -6 29 0 M900 514 q14 -6 28 0 M936 514 q14 -6 27 0 M970 514 q11 -6 23 0 M1002 514 q14 -6 27 0 M1038 514 q10 -6 20 0 M1066 514 q11 -6 22 0 M1095 514 q14 -6 28 0 M1130 514 q14 -6 29 0 M1170 514 q10 -6 20 0 M1199 514 q12 -6 25 0 M1229 514 q12 -6 24 0" />
            <path d="M564 538 q16 -7 32 0 M602 538 q16 -7 31 0 M645 538 q13 -7 27 0 M677 538 q13 -7 25 0 M712 538 q12 -7 24 0 M742 538 q15 -7 30 0 M784 538 q15 -7 29 0 M822 538 q16 -7 32 0 M861 538 q16 -7 31 0 M899 538 q16 -7 32 0 M943 538 q12 -7 25 0 M977 538 q16 -7 32 0 M1015 538 q14 -7 27 0 M1055 538 q18 -7 37 0 M1098 538 q17 -7 33 0 M1143 538 q14 -7 27 0 M1180 538 q12 -7 25 0 M1213 538 q16 -7 33 0" />
            <path d="M591 566 q16 -9 31 0 M630 566 q22 -9 44 0 M684 566 q19 -9 37 0 M729 566 q23 -9 46 0 M785 566 q15 -9 30 0 M826 566 q18 -9 35 0 M870 566 q17 -9 33 0 M912 566 q18 -9 35 0 M953 566 q20 -9 40 0 M1000 566 q21 -9 43 0 M1049 566 q21 -9 42 0 M1102 566 q19 -9 38 0 M1150 566 q17 -9 34 0 M1195 566 q18 -9 37 0 M1239 566 q23 -9 45 0" />
            <path d="M579 602 q27 -11 55 0 M642 602 q25 -11 51 0 M699 602 q27 -11 54 0 M761 602 q19 -11 39 0 M812 602 q20 -11 41 0 M864 602 q29 -11 57 0 M931 602 q19 -11 38 0 M975 602 q21 -11 42 0 M1025 602 q25 -11 50 0 M1087 602 q22 -11 45 0 M1138 602 q24 -11 49 0 M1194 602 q20 -11 39 0" />
            <path d="M603 644 q24 -13 48 0 M660 644 q32 -13 64 0 M735 644 q28 -13 56 0 M802 644 q25 -13 51 0 M863 644 q33 -13 66 0 M940 644 q29 -13 59 0 M1005 644 q24 -13 48 0 M1062 644 q25 -13 51 0 M1123 644 q24 -13 49 0 M1182 644 q26 -13 52 0 M1240 644 q25 -13 51 0" />
          </g>
          <!-- the window's glow on the wet stones -->
          <g stroke="#b0904e" stroke-width="3" stroke-linecap="round">
            <path d="M740 526 h40 M800 528 h60 M880 526 h50 M760 556 h70 M850 558 h60 M790 594 h90 M900 596 h40" />
          </g>
        </g>
      </g>
    </svg>
  </main>
  <script src="woodcut.js"></script>
</body>
</html>
